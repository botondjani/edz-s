name: APK build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Ha be van állítva a KEYSTORE_BASE64 titok, azzal írunk alá (így az új APK ráfrissíthető a régire).
      - env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/edzes.jks"
            echo "EDZES_KEYSTORE=$RUNNER_TEMP/edzes.jks" >> "$GITHUB_ENV"
          fi
      - env:
          EDZES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease
      - run: mv app/build/outputs/apk/release/app-release.apk edzes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: edzes-apk
          path: edzes.apk
      # A main ágon a legfrissebb APK fix linken is elérhető (Releases → latest).
      - if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest edzes.apk --title "Edzés 1.0.${{ github.run_number }}" --notes "Automatikus build" --target "${{ github.sha }}"
